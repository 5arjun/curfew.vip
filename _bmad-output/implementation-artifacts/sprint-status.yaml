st.ts (5 tests) -- that whole most-played rewrite had NO test file before. Gate: 237/237 tests, clean tsc, clean eslint, clean next build. STILL OPEN (2 decisions): AC-5/AC-6 define Shannon H while the UI ships 2^H; D-3 amended by code comment only (TrendChart imports curve math from energyArc.ts). Also still open inside the most-played finding: the future-date guard removed with nowMs (a clock-skewed future set still becomes `latest` and drives ConfidenceTile), left alone because restoring it reintroduces Date.now() into a deliberately deterministic function.
