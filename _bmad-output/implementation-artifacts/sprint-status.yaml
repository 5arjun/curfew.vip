t { noAddDateCount, pendingCohortCount } directly (not a full LibraryConversionModel) so the live meter can reuse the identical generator with pendingCohortCount forced to 0. Task 3 (web): extracted LedPips (web/app/components/ui/LedPips.tsx) rather than copy-paste -- both StatsColumn's harmonic hero and the new meter render the identical shipped .sd-pips/.sd-pip markup (UX-DR11) through one component; new library-utilization.css (lu- prefix) for page/module chrome only. Task 4 (web): real /library-utilization page superseding the Story 3.5 stub; deliberately NO page-level insufficient-history gate (unlike Style Evolution's trend chart) -- the meter is a live snapshot, not a multi-point trend, so ConversionRateMeter's own added===0 branch already renders the empty state honestly; LIBRARY_INSUFFICIENT_COPY was NOT reused since it describes a different metric's wait condition. Task 5 (fixtures): re-ran BOTH real exports against Arjun's actual reachable Serato data on his real machine (not simulated) -- export_real_library (653 catalogued tracks) and export_real_fixtures (the same 58 committed sessions) -- then rebuilt both committed fixtures. Diffed old vs new recent-sets.fixture.json: every changed line is a track_id value (2,294 of them), confirming the regen touched identity only. MEASURED EFFECT (boot-drive-only this session, no USB mounted): join rate (add-events ever played) went 20% (143/714) -> 45% (237/523) -- roughly doubled on the reachable subset, the expected direction. DISCLOSED COST: 473/2,294 real plays (~21%) now carry no track_id, mostly missing artist tags (380 of 473) -- the old path scheme had 100% coverage by construction but silently split identical tracks across drives; this is the correctness/coverage trade the "require both fields" design deliberately makes, not re-litigated this session. SCOPE LIMIT: full cross-drive magnitude (the story's own motivating stat -- 2,115 of 2,294 real plays resolve from a non-boot drive) needs a re-run with the