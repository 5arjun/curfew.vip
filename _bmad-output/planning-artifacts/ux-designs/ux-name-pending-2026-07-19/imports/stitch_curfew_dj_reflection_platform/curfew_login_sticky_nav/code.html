<!-- Background Atmospheric Interaction -->
<script>
    document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        
        // Subtle parallax for background
        const bg = document.querySelector('.bg-cover');
        bg.style.transform = `scale(1.05) translate(${x * 15}px, ${y * 15}px)`;
    });

    // Simple input focus micro-interaction
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.parentElement.classList.add('translate-x-1');
        });
        input.addEventListener('blur', () => {
            input.parentElement.parentElement.classList.remove('translate-x-1');
        });
    });
</script>
