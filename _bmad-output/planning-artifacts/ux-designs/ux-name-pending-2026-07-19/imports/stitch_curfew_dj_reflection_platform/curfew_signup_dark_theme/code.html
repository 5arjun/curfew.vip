<!-- UI Logic Scripts -->
<script>
        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('password');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form Submission Micro-interaction
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[16px]">refresh</span> Processing...`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined text-[16px]">check_circle</span> Initialized`;
                btn.classList.remove('bg-surface-container-highest');
                btn.classList.add('bg-primary', 'text-on-primary-fixed', 'border-primary');
            }, 1500);
        });

        // Background Drift
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 100;
            const y = (window.innerHeight / 2 - e.pageY) / 100;
            const atmosphere = document.getElementById('atmosphere');
            if(atmosphere) atmosphere.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
<style>
        .material-symbols-outlined {
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
