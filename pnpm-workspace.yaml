# Curfew pnpm workspace.
# Members are the JS/TS workspaces only. The Rust core (agent/src-tauri) is NOT
# a JS package and is intentionally absent. Planning/tooling dirs (_bmad, _bmad-output,
# output, docs, .claude) are deliberately NOT workspaces.
#
# Dependency rule (ARCHITECTURE-SPINE AD-3): agent -> shared, web -> shared;
# agent and web NEVER depend on each other. Both reach the cloud only through
# the versioned sync contract in shared/.
packages:
  - shared
  - web
  - agent

# pnpm 10+ blocks dependency build scripts by default and this repo's supply-chain
# gate requires an explicit decision per package. sharp and unrs-resolver (pulled
# transitively by Next.js) ship prebuilt platform binaries via optional deps, so
# their native build scripts are not needed — denied here for a reproducible install.
#
# @sentry/cli is the exception and is allowed: unlike the two below it does NOT
# ship a prebuilt binary as an optional dep — its postinstall is what fetches the
# sentry-cli executable, and @sentry/nextjs shells out to that binary to upload
# source maps at build time. Denied, the install succeeds and the Vercel build
# succeeds, and the only symptom is that every web stack trace in Sentry stays
# minified — a silent failure, which is why this is spelled out rather than left
# at pnpm's placeholder.
#
# core-js arrives transitively under posthog-js. Its postinstall is a funding
# appeal printed to stdout — it compiles nothing and ships no binary, so
# denying it costs the install nothing and keeps one less script running.
allowBuilds:
  '@sentry/cli': true
  core-js: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - core-js
  - sharp
  - unrs-resolver
