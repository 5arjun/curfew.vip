[package]
name = "agent"
version = "0.0.0"
description = "Curfew local agent — Tauri 2 core (capture/parse/stat pipeline lands in Stories 1.3-1.7)."
authors = ["Curfew"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (avoids a Windows
# duplicate-symbol issue: rust-lang/cargo#8519).
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Serato parsing / enrichment crates (AR-5). Pinned to an exact triseratops commit
# — the crates.io release (0.0.3) is stale, and `main` must not be floated so the
# build is reproducible. Story 1.3's own from-scratch `.session` parser does not
# call either crate yet: `triseratops::library` is Story 1.4's library-join concern
# and `id3` is Story 1.5's embedded-tag concern. They are wired now so 1.4/1.5 are
# not blocked on dependency plumbing (a declared-but-unused external crate does not
# trip `clippy -D warnings` — only unused `use` imports do).
triseratops = { git = "https://github.com/Holzhaus/triseratops.git", rev = "8e92aae1794c4f02a2405eb88ea72f251b077f0c" }
id3 = "1.17.0"

# Vorbis-comment reads for FLAC/OGG (Story 1.5's embedded-tag fallback, the Vorbis
# half of AD-11 that `id3` doesn't cover). Default features disabled: the only
# default feature (`id3v2_compression_support`) pulls in `flate2` for ID3v2
# compression this story never needs — all ID3 reads go through `id3` above, not
# lofty. Used narrowly for FLAC/OGG Vorbis-comment field access only.
lofty = { version = "0.24.0", default-features = false }

# Serato 4+ `master.sqlite` reads (Story 1.4's `joiner::serato4`). `bundled`
# statically links SQLite into the binary so a packaged agent never depends on
# whatever SQLite version the DJ's OS happens to ship — a distribution
# requirement for a signed desktop app (AR-14), not a convenience. Compiling the
# vendored C source needs only a C toolchain, which CI's Tauri Linux prereqs
# (`build-essential`) already install.
rusqlite = { version = "0.40.1", features = ["bundled"] }
