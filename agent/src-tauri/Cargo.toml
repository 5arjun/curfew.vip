[package]
name = "agent"
# Placeholder, not a real version. Both release workflows substitute the version
# from the pushed `agent-v*` tag at build time, and both first assert this line
# reads exactly "0.0.0" — a guard that fails the release rather than shipping a
# wrongly-versioned binary. Keep it in sync with the same placeholder in
# tauri.conf.json and agent/package.json; editing it here (as commit a1e42ce did,
# bumping it to 0.1.0 as a side effect of an unrelated web story) breaks every
# release build with "version anchor (0.0.0) was not found".
version = "0.0.0"
description = "Curfew local agent — Tauri 2 core (capture/parse/stat pipeline lands in Stories 1.3-1.7)."
authors = ["Curfew"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (avoids a Windows
# duplicate-symbol issue: rust-lang/cargo#8519).
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Loads `.env.local` inside `build.rs` only (Story 2.10 Task 2) so the agent's
# build-time Supabase/web-URL config mirrors `web/`'s env convention without a
# runtime dependency — never shipped in the compiled binary.
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native folder picker for the Serato path override field (Story 2.5, AC-2) — the
# settings panel is plain HTML/CSS, not a custom dropzone widget.
tauri-plugin-dialog = "2"

# Signed auto-updater (Story 2.9c, AR-14) — consumes the `latest.json` +
# `.sig` artifacts the release workflows produce via `tauri-action`'s
# `uploadUpdaterJson`/`uploadUpdaterSignatures`. No JS/frontend consumer calls
# check()/downloadAndInstall() yet (see Task 1's scope note in the story) —
# this wires the plugin so it's functional once something does.
tauri-plugin-updater = "2"

# Serato parsing / enrichment crates (AR-5). Pinned to an exact triseratops commit
# — the crates.io release (0.0.3) is stale, and `main` must not be floated so the
# build is reproducible. Story 1.3's own from-scratch `.session` parser does not
# call either crate yet: `triseratops::library` is Story 1.4's library-join concern
# and `id3` is Story 1.5's embedded-tag concern. They are wired now so 1.4/1.5 are
# not blocked on dependency plumbing (a declared-but-unused external crate does not
# trip `clippy -D warnings` — only unused `use` imports do).
triseratops = { git = "https://github.com/Holzhaus/triseratops.git", rev = "8e92aae1794c4f02a2405eb88ea72f251b077f0c" }
id3 = "1.17.0"

# Vorbis-comment reads for FLAC/OGG (Story 1.5's embedded-tag fallback, the Vorbis
# half of AD-11 that `id3` doesn't cover). Default features disabled: the only
# default feature (`id3v2_compression_support`) pulls in `flate2` for ID3v2
# compression this story never needs — all ID3 reads go through `id3` above, not
# lofty. Used narrowly for FLAC/OGG Vorbis-comment field access only.
lofty = { version = "0.24.0", default-features = false }

# Serato 4+ `master.sqlite` reads (Story 1.4's `joiner::serato4`). `bundled`
# statically links SQLite into the binary so a packaged agent never depends on
# whatever SQLite version the DJ's OS happens to ship — a distribution
# requirement for a signed desktop app (AR-14), not a convenience. Compiling the
# vendored C source needs only a C toolchain, which CI's Tauri Linux prereqs
# (`build-essential`) already install.
rusqlite = { version = "0.40.1", features = ["bundled"] }

# Cross-platform removable/USB volume enumeration (Story 2.6 Task 2) — no
# per-OS hand-rolling (`/Volumes` scanning, drive-letter enumeration); `Disks`
# + `Disk::is_removable()`/`Disk::mount_point()` cover both macOS and Windows.
sysinfo = "0.39.6"

# The DJ's IANA time zone name at capture time (Story 7.7). Reads the OS's own
# zone setting (macOS `/etc/localtime` symlink, Windows registry) and returns
# the tzdata name — `"America/Los_Angeles"`, not an offset.
#
# Why this crate and not the obvious alternative: `chrono::Local` / `time`'s
# `UtcOffset::current_local_offset` both give an *offset*, and `time` refuses
# outright in a multithreaded process (its `local-offset` soundness fix — the
# underlying libc `localtime_r` races with `setenv`). A Tauri app is
# unavoidably multithreaded, so that API returns `Err` in production while
# working fine in a single-threaded unit test — the worst possible failure
# shape. An offset would also be wrong on its own terms here: re-applying a
# summer `-07:00` to a January set shifts it by an hour, which is the exact
# class of bug this story exists to remove. The zone name survives DST and
# tzdata revisions; `iana-time-zone` reads it without the libc race.
iana-time-zone = "0.1"

# Cross-platform filesystem watcher (Story 2.6 Task 6) — the API the
# architecture spine's pipeline diagram already names for the `watcher` stage.
# `recommended_watcher` picks the OS-native backend (FSEvents on macOS,
# ReadDirectoryChangesW on Windows) so this crate never touches a raw platform
# API directly.
notify = "8.2.0"

# Account-linking deep-link handoff (Story 2.10, Task 3, AD-10): captures the
# `curfew-agent://link?...` redirect `web/`'s `/link-agent` page sends. Must be
# paired with `tauri-plugin-single-instance` (below) — desktop deep-links
# otherwise launch a second agent process instead of notifying the one
# already running in the tray.
tauri-plugin-deep-link = "2"

# See `tauri-plugin-deep-link` above — registered *first* in the plugin chain
# (`lib.rs`'s `.setup()`), per this plugin's own requirement, so a second
# launch via the `curfew-agent://` scheme forwards its URL into the already-
# running instance instead of opening a duplicate tray icon.
tauri-plugin-single-instance = "2"

# Opens the DJ's default system browser to `web/`'s `/link-agent` page (Story
# 2.10, Task 6) — Tauri v2's dedicated, current-recommended plugin for this,
# not `tauri-plugin-shell`'s older `open()`, which the ecosystem has moved off
# of for this exact use case.
tauri-plugin-opener = "2"

# Parses the `curfew-agent://link?access_token=...&refresh_token=...` query
# string (Task 3) — already transitively resolved via Tauri itself per
# `Cargo.lock`, but a transitive resolution isn't importable without its own
# `[dependencies]` entry.
url = "2"

# Cross-platform OS-native secure storage (Story 2.10, Task 4, AD-10) — macOS
# Keychain / Windows Credential Manager behind one API. The only thing that
# makes the refresh token *securely* stored rather than a plain JSON file
# (which `tauri-plugin-store` would be, no better than this crate's own
# `settings.rs`/`store.rs`). `keyring` 3.x ships **no default features** —
# with none enabled it silently falls back to a no-op mock backend that
# reports every `save()`/`load()` as successful without ever touching a real
# credential store (caught during this story's own Task 8 manual walkthrough:
# `save()` returned `Ok(())` but the token was never retrievable, by this
# crate's own `load()` or by `security find-generic-password`, until this
# feature was added). `apple-native`/`windows-native` cover this project's two
# actual release targets (Stories 2.9a/2.9b); no Linux release workflow
# exists yet, so a Linux Secret Service backend isn't wired.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# Supabase Auth REST calls (Story 2.10, Task 5) — token refresh. Already
# transitively resolved (Tauri's own updater plugin pulls it in with a full
# rustls stack per `Cargo.lock`), but a transitive resolution isn't importable
# without its own `[dependencies]` entry. `rustls` (not the default
# `native-tls`) avoids a second, OS-native TLS stack on top of whatever
# Tauri's own webview/updater machinery already uses, and cross-compiles more
# predictably for the signed macOS+Windows release pipeline (Stories 2.9a/b).
# Reqwest 0.13 renamed the old `rustls-tls` feature to plain `rustls`, which
# already pulls in `rustls-platform-verifier` for OS-native cert-store
# verification — there is no separate `rustls-native-certs` feature (Review
# Findings: requesting that nonexistent-as-of-0.13.4 feature name was what
# forced Cargo's resolver back onto the older, security-regressed 0.13.1).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "blocking"] }

# Agent-side tagged error reporting (Story 3.4, Task 1, AD-13/AR-7 layer 2:
# a real error-tracking provider so format-drift that only surfaces on a
# real DJ's machine post-release is ever seen at all). The official crate,
# not a bespoke Supabase write path -- AD-8 forbids inventing a second
# exception to its "no ad-hoc write path" rule (Stripe's webhook is the one
# carved-out exception), and a genuinely external third-party service was
# never a "cloud mutation" in AD-8's sense to begin with. Same "buy the
# undifferentiated part" posture already applied to Stripe/triseratops/id3/
# rusqlite. `default-features = false` then explicit `reqwest`+`rustls`:
# the crate's own default pairs `reqwest` with `native-tls`, and `rustls`
# (not `native-tls`) mirrors the `reqwest` dependency's own TLS choice
# above -- one TLS stack, not two. `config::SENTRY_DSN` compiles to an
# empty string until Arjun provisions a real DSN (see `config.rs`), at
# which point `error_reporting::SentryReporter` no-ops rather than sending.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# JWT `exp`/`sub` claim extraction (Task 5) — already transitively resolved
# (it's `reqwest`'s own dependency per `Cargo.lock`), needs its own entry for
# the same reason as `reqwest`/`url` above. No signature verification is done
# with it (Supabase's backend verifies server-side on every real request) —
# deliberately not `jsonwebtoken`, which is full verification machinery this
# story has no use for.
base64 = "0.22"

# One-time CSRF nonce for the deep-link handoff (Review Findings, Task 3/6):
# the agent generates a random value when opening the browser for "Link
# Account," and rejects a `curfew-agent://link` callback whose nonce doesn't
# match. Already transitively resolved (same "not importable without its own
# entry" reasoning as `reqwest`/`url`/`base64` above); `v4` is for that random
# generation. `v5` (Story 3.2, Task 1) adds `Uuid::new_v5`, the deterministic
# namespaced hash `set_id = hash(dj_id, session_identity)` (AD-4) is built
# from — namespace-based, not random, so it needs its own feature flag.
# `serde` (Story 3.2, Task 3) is needed for `sync.rs`'s `response.json::<Uuid>()`
# (`Uuid: DeserializeOwned`) — requested explicitly rather than relying on it
# being enabled transitively via `tauri-utils` (review finding: a future
# tauri dependency bump could silently drop that transitive requirement and
# break this crate's build with an unrelated-looking error).
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Tray icon light/dark selection (tray.rs): the tray's colored state icons
# can't be macOS "template" images (those discard color, keeping only an
# alpha mask), and the general system Appearance preference doesn't reliably
# match the *menu bar's* actual rendered darkness (desktop-picture vibrancy
# can tint the bar dark even in Light Appearance). Tauri's tray API doesn't
# expose the underlying `NSStatusItem`, so a dedicated zero-width status item
# is created directly via these bindings purely to read the true, menu-bar-
# hosted `effectiveAppearance` — the same signal AppKit uses to resolve
# template icons correctly. Versions matched to what `tao` (Tauri's own
# windowing crate) already resolves in Cargo.lock, to avoid a second copy of
# these getting compiled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }

# `demo_overlay_scrub` is the only example carrying its own `#[cfg(test)]`
# module, and examples default to `test = false` — so its ten rule tests were
# built by CI and never RUN by it. They are the entire safety net on ~156
# automated title/artist rewrites (an over-eager rule would mangle a title with
# nobody reading the 4,000-row diff), so they get gated like any other test.
# Declaring one example does not turn off autodiscovery for the others.
[[example]]
name = "demo_overlay_scrub"
test = true
