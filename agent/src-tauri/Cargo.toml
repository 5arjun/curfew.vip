[package]
name = "agent"
version = "0.0.0"
description = "Curfew local agent — Tauri 2 core (capture/parse/stat pipeline lands in Stories 1.3-1.7)."
authors = ["Curfew"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (avoids a Windows
# duplicate-symbol issue: rust-lang/cargo#8519).
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# NOTE: parser/enrichment crates (triseratops @ a pinned git commit, id3, ...) are
# intentionally NOT added here — they arrive in Story 1.3 (AR-5). This story only
# proves the shell compiles and can consume the shared sync contract (AC-2).
