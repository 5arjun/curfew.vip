name: CI

# Lints + builds each workspace and applies the Supabase migration cleanly.
# This is the regression gate for the monorepo scaffold (Story 1.1).
# NOTE: signed Tauri bundling / notarization / installers are intentionally OUT
# OF SCOPE here — that is Epic 2 (AR-14). CI compiles the Rust core; it does not
# produce or sign installers.

# push runs only on main; branch validation happens via pull_request, so a PR
# branch does not double-run the whole matrix (push + pull_request) on every push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS/TS (shared · web · agent-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # release-*.yml only ever run on a tag push, so nothing here or in any PR
      # executes them and breakage accumulates unseen — on 2026-08-16 they had
      # been broken since July by two separate commits, and both surfaced only
      # when the first real release was attempted. This is a one-second static
      # check of the invariants those runs depend on, deliberately a hard
      # failure: a warning about something that only bites on release day is a
      # warning nobody reads. Lives in the js job rather than its own, since a
      # dedicated job's setup would cost far more than the check.
      - name: Check release workflow invariants
        run: ./.github/scripts/check-release-workflows.sh

  agent:
    name: Agent (Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 Linux build prerequisites (WebKitGTK etc.). macOS/Windows use
      # system frameworks and need none of this; only the Linux runner does.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/src-tauri

      - name: Format check
        run: cargo fmt --manifest-path agent/src-tauri/Cargo.toml -- --check

      - name: Clippy (deny warnings, incl. tests)
        run: cargo clippy --manifest-path agent/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path agent/src-tauri/Cargo.toml

      - name: Test (incl. shared-contract consumption)
        run: cargo test --manifest-path agent/src-tauri/Cargo.toml

  supabase:
    name: Supabase migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static, dependency-free checks run first so a violation fails fast,
      # before paying for the Docker/Postgres round-trip below.
      - name: Additive-only migration guard
        run: supabase/scripts/check-additive-only-migrations.sh supabase/migrations

      - name: Additive-only migration guard self-test
        run: supabase/scripts/check-additive-only-migrations.test.sh

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ubuntu-latest ships Docker; boot the local Postgres and apply migrations.
      - name: Start local Postgres
        run: supabase start

      - name: Apply migrations (assert clean apply)
        run: supabase migration up

      - name: Run pgTAP tests
        run: supabase test db supabase/tests
