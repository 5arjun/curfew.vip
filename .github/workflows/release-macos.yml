name: Release macOS

# Signed, notarized macOS release build (Story 2.9a, AR-14). Separate from
# ci.yml on purpose: ci.yml's agent job is Linux-only and explicitly out of
# scope for signed bundling (see its header). This workflow only runs on a
# release tag, not on every push/PR, so a macOS runner never slows down the
# regular CI gate.
#
# Notarization method: API key (APPLE_API_ISSUER/APPLE_API_KEY/APPLE_API_KEY_PATH)
# — chosen over the Apple-ID + app-specific-password method because it has no
# 2FA/password rotation to babysit in unattended CI.
#
# Required GitHub Actions secrets (not yet provisioned — see
# pre-launch-services-checklist.md row 32):
#   APPLE_CERTIFICATE          - base64-encoded .p12 Developer ID Application cert
#   APPLE_CERTIFICATE_PASSWORD - the .p12 export password
#   APPLE_SIGNING_IDENTITY     - e.g. "Developer ID Application: <Name> (<TEAMID>)"
#   APPLE_API_ISSUER           - notarization API key issuer ID
#   APPLE_API_KEY              - notarization API key ID
#   APPLE_API_KEY_CONTENT      - full contents of the downloaded API key .p8 file
#                                (APPLE_API_KEY_PATH is NOT a secret — runners are
#                                ephemeral, so the .p8 content itself must be a
#                                secret; the "Write Apple notarization key" step
#                                below materializes it to a path on the runner)
#   TAURI_SIGNING_PRIVATE_KEY          - Story 2.9c: updater-signing private key
#                                        (`tauri signer generate` output), distinct
#                                        from the platform code-signing certs above
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - optional; empty/unset if the keypair was
#                                        generated without a password
#
# Local dev is unaffected: with no APPLE_* env vars set, tauri.conf.json has no
# bundle.macOS.signingIdentity, so a local build falls back to unsigned.

on:
  push:
    tags:
      - 'agent-v*.*.*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, sign, and notarize (universal macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check updater pubkey is configured
        shell: bash
        run: |
          if grep -q '<TAURI_UPDATER_PUBLIC_KEY_PLACEHOLDER>' agent/src-tauri/tauri.conf.json; then
            echo "::error::agent/src-tauri/tauri.conf.json still has the <TAURI_UPDATER_PUBLIC_KEY_PLACEHOLDER> placeholder — run 'tauri signer generate' and replace it before releasing (see pre-launch-services-checklist.md's Tauri updater signing keypair row)."
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon + Intel targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Write Apple notarization key to disk
        run: echo "${{ secrets.APPLE_API_KEY_CONTENT }}" > "${{ runner.temp }}/AuthKey.p8"

      # Story 2.9c: derives the real version from the pushed tag and writes it
      # into the ephemeral runner's checkout only — never committed back. An
      # updater that always reports 0.0.0 can never detect a newer release.
      # Validates the extracted version and the Cargo.toml substitution actually
      # landed, so a malformed tag or a future Cargo.toml edit fails loudly here
      # instead of silently shipping a stale or wrong version.
      - name: Sync app version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Extracted version '$VERSION' from ref '$GITHUB_REF_NAME' is not valid semver"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const confPath = 'agent/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
            const pkgPath = 'agent/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          if ! grep -q '^version = "0.0.0"$' agent/src-tauri/Cargo.toml; then
            echo "::error::Cargo.toml's version anchor (0.0.0) was not found — the sync step is stale relative to the committed file"
            exit 1
          fi
          sed -i.bak "s/^version = \"0.0.0\"/version = \"$VERSION\"/" agent/src-tauri/Cargo.toml && rm agent/src-tauri/Cargo.toml.bak
        shell: bash

      # Pinned to the exact commit behind the v1 tag (2026-06-29) rather than the
      # floating tag itself — this step receives the Apple signing cert, cert
      # password, and notarization API key directly via env, so it gets the same
      # exact-commit reproducibility bar this repo already applies to triseratops.
      - name: Build, sign, and notarize
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Baked into the binary by `agent/src-tauri/build.rs` via
          # `cargo:rustc-env`. An unset var there compiles to an empty string
          # rather than failing the build, so omitting these does not break CI
          # — it ships an agent that silently cannot reach Supabase and whose
          # "Link Account" item opens an empty origin. Keep all three set.
          # The two URLs are hardcoded rather than stored as repo secrets:
          # neither is secret, and inlining them keeps a release reproducible
          # from the commit alone instead of from dashboard state.
          SUPABASE_URL: https://jmitbnrofacxwsbwuxzs.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
          CURFEW_WEB_URL: https://curfew.vip
        with:
          projectPath: agent
          args: --target universal-apple-darwin --config agent/src-tauri/tauri.macos-release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Curfew Agent ${{ github.ref_name }}'
