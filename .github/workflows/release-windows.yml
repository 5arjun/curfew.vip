name: Release Windows

# Signed Windows release build (Story 2.9b, AR-14). Separate from ci.yml on
# purpose, same reasoning as release-macos.yml: ci.yml's agent job is
# Linux-only, and release workflows are per-OS, tag-triggered only, so a
# Windows runner never slows down the regular CI gate. Runs alongside
# release-macos.yml on the same `agent-v*.*.*` tag push — both publish to the
# same GitHub Release.
#
# Signing method: Azure Artifact Signing (renamed from "Trusted Signing" in
# January 2026), via the `artifact-signing-cli` CLI. Chosen over a
# traditional CA-purchased OV/EV cert + physical HSM token because, since the
# CA/Browser Forum's June 1, 2023 Baseline Requirements, the private key for
# any publicly-trusted code-signing cert (OV or EV) must live on
# HSM-certified hardware and cannot be exported — there is no `.p12`-style
# flat file to base64 into a secret the way release-macos.yml does with
# APPLE_CERTIFICATE. What becomes the CI secret instead is a service
# principal's credentials, authorized to request signatures from Azure's
# HSM-backed signing service; the private key itself never leaves Azure.
#
# Required GitHub Actions secrets (not yet provisioned — see
# pre-launch-services-checklist.md rows 30 and 32):
#   AZURE_CLIENT_ID                             - App Registration client ID
#   AZURE_CLIENT_SECRET                          - App Registration client secret
#   AZURE_TENANT_ID                              - Azure AD tenant ID
#   AZURE_ARTIFACT_SIGNING_ACCOUNT               - Artifact Signing account name
#   AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE   - certificate profile name
#   TAURI_SIGNING_PRIVATE_KEY                    - Story 2.9c: updater-signing
#                                                  private key (`tauri signer
#                                                  generate` output), the same
#                                                  shared keypair release-macos.yml
#                                                  uses — distinct from the Azure
#                                                  code-signing credentials above
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD           - optional; empty/unset if the
#                                                  keypair was generated without
#                                                  a password
#
# Local dev is unaffected: the signCommand lives only in
# tauri.windows-release.conf.json, merged in via --config at release time
# (Task 2) — a plain local `cargo tauri build` never sees it, so it isn't
# forced to have artifact-signing-cli installed or Azure credentials present.
#
# Open item (see pre-launch-services-checklist.md row 30): the CLI's signing
# endpoint (-e/--endpoint) has no environment-variable equivalent, so it is
# baked into tauri.windows-release.conf.json as a literal value — but that
# value is region-specific to wherever the Azure Artifact Signing account
# gets provisioned, which hasn't happened yet. The placeholder there must be
# replaced once Arjun provisions the account.

on:
  push:
    tags:
      - 'agent-v*.*.*'

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and sign (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check updater pubkey is configured
        shell: bash
        run: |
          if grep -q '<TAURI_UPDATER_PUBLIC_KEY_PLACEHOLDER>' agent/src-tauri/tauri.conf.json; then
            echo "::error::agent/src-tauri/tauri.conf.json still has the <TAURI_UPDATER_PUBLIC_KEY_PLACEHOLDER> placeholder — run 'tauri signer generate' and replace it before releasing (see pre-launch-services-checklist.md's Tauri updater signing keypair row)."
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check signing endpoint is provisioned
        shell: bash
        run: |
          if grep -q '<AZURE_ARTIFACT_SIGNING_ENDPOINT>' agent/src-tauri/tauri.windows-release.conf.json; then
            echo "::error::agent/src-tauri/tauri.windows-release.conf.json still has the <AZURE_ARTIFACT_SIGNING_ENDPOINT> placeholder — replace it with the real regional endpoint once the Azure Artifact Signing account is provisioned (see pre-launch-services-checklist.md row 30)."
            exit 1
          fi

      # Pinned to an exact version, matching this file's tauri-action pin
      # below — a future artifact-signing-cli release could otherwise change
      # CLI flags/behavior at the next tag push with no warning.
      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      # Story 2.9c: same version-sync step as release-macos.yml — derives the
      # real version from the pushed tag, ephemeral-checkout-only. windows-latest
      # defaults to PowerShell, so `shell: bash` is explicit here (Git Bash ships
      # on windows-latest) to keep the bash substitution/sed idiom identical to
      # the macOS workflow.
      - name: Sync app version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Extracted version '$VERSION' from ref '$GITHUB_REF_NAME' is not valid semver"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const confPath = 'agent/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
            const pkgPath = 'agent/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          if ! grep -q '^version = "0.0.0"$' agent/src-tauri/Cargo.toml; then
            echo "::error::Cargo.toml's version anchor (0.0.0) was not found — the sync step is stale relative to the committed file"
            exit 1
          fi
          sed -i.bak "s/^version = \"0.0.0\"/version = \"$VERSION\"/" agent/src-tauri/Cargo.toml && rm agent/src-tauri/Cargo.toml.bak
        shell: bash

      # Pinned to the exact commit behind the v1 tag, matching
      # release-macos.yml's pin exactly — same tag, same resolved commit, so
      # the two sibling release workflows never drift onto different
      # tauri-action versions.
      - name: Build and sign
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # See the identical block in `release-macos.yml` for why these three
          # are here and why the URLs are inlined. Both workflows must carry
          # the same set — a value present in one and missing in the other
          # ships two differently-broken binaries from the same tag.
          SUPABASE_URL: https://jmitbnrofacxwsbwuxzs.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
          CURFEW_WEB_URL: https://curfew.vip
        with:
          projectPath: agent
          args: --config agent/src-tauri/tauri.windows-release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Curfew Agent ${{ github.ref_name }}'
