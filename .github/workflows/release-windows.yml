name: Release Windows

# Unsigned Windows release build (Story 2.9b, AR-14). Separate from ci.yml on
# purpose, same reasoning as release-macos.yml: ci.yml's agent job is
# Linux-only, and release workflows are per-OS, tag-triggered only, so a
# Windows runner never slows down the regular CI gate. Runs alongside
# release-macos.yml on the same `agent-v*.*.*` tag push — both publish to the
# same GitHub Release.
#
# NOT code-signed — a deliberate ruling by Arjun on 2026-08-16, not an
# oversight or a temporary state. Windows has no equivalent of the Apple
# membership that already covers macOS signing + notarization: the only real
# options were Azure Artifact Signing (~$120/yr, and what this file was
# originally built around) or a traditional CA cert (~$200-400/yr plus HSM
# hardware, since the CA/Browser Forum's June 2023 Baseline Requirements bar
# an exportable private key). Neither was judged worth buying before real
# signups show whether Curfew's DJs are on Windows at all — Serato skews
# heavily Mac. The Azure wiring (artifact-signing-cli install step, five
# AZURE_* secrets, and the signCommand in tauri.windows-release.conf.json) was
# removed rather than left in place, so nothing here looks provisioned when it
# is not.
#
# What that costs the user, stated plainly so nobody has to rediscover it:
# SmartScreen shows a full-screen "Windows protected your PC" block on first
# run, and the installer is only reachable via "More info" -> "Run anyway".
# The download page should say so before the user meets it.
#
# What it does NOT cost: update integrity. TAURI_SIGNING_PRIVATE_KEY below is
# the updater keypair (minisign, Story 2.9c) and is unrelated to Authenticode
# — update payloads stay cryptographically verified either way.
#
# To reverse this, restore the Azure block from git history at this commit's
# parent; the workflow was fully written and only ever lacked provisioning.
#
# Required GitHub Actions secrets:
#   TAURI_SIGNING_PRIVATE_KEY          - updater-signing private key (`tauri
#                                        signer generate` output), the same
#                                        shared keypair release-macos.yml uses
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - optional; empty/unset if the keypair
#                                        was generated without a password
#
# Local dev is unaffected, as before: tauri.windows-release.conf.json is merged
# in via --config only at release time.

on:
  push:
    tags:
      - 'agent-v*.*.*'

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build unsigned (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check updater pubkey is configured
        shell: bash
        run: |
          if grep -q '<TAURI_UPDATER_PUBLIC_KEY_PLACEHOLDER>' agent/src-tauri/tauri.conf.json; then
            echo "::error::agent/src-tauri/tauri.conf.json still has the <TAURI_UPDATER_PUBLIC_KEY_PLACEHOLDER> placeholder — run 'tauri signer generate' and replace it before releasing (see pre-launch-services-checklist.md's Tauri updater signing keypair row)."
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The "Check signing endpoint is provisioned" step that stood here was
      # removed with the Azure signing path: it grepped for a placeholder that
      # no longer exists in tauri.windows-release.conf.json, so it could only
      # ever pass — a guard that cannot fail is worse than none, because it
      # reads as coverage.

      # Story 2.9c: same version-sync step as release-macos.yml — derives the
      # real version from the pushed tag, ephemeral-checkout-only. windows-latest
      # defaults to PowerShell, so `shell: bash` is explicit here (Git Bash ships
      # on windows-latest) to keep the bash substitution/sed idiom identical to
      # the macOS workflow.
      - name: Sync app version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#agent-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Extracted version '$VERSION' from ref '$GITHUB_REF_NAME' is not valid semver"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const confPath = 'agent/src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n');
            const pkgPath = 'agent/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          if ! grep -q '^version = "0.0.0"$' agent/src-tauri/Cargo.toml; then
            echo "::error::Cargo.toml's version anchor (0.0.0) was not found — the sync step is stale relative to the committed file"
            exit 1
          fi
          sed -i.bak "s/^version = \"0.0.0\"/version = \"$VERSION\"/" agent/src-tauri/Cargo.toml && rm agent/src-tauri/Cargo.toml.bak
        shell: bash

      # Pinned to the exact commit behind the v1 tag, matching
      # release-macos.yml's pin exactly — same tag, same resolved commit, so
      # the two sibling release workflows never drift onto different
      # tauri-action versions.
      # NOT code-signed — deliberate, see this file's header. TAURI_SIGNING_*
      # below is the updater keypair, which is a different thing and is still
      # required: it signs the update payload so an installed agent will accept
      # it. Dropping it would break auto-update, not just the install prompt.
      - name: Build (unsigned)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # See the identical block in `release-macos.yml` for why these three
          # are here and why the URLs are inlined. Both workflows must carry
          # the same set — a value present in one and missing in the other
          # ships two differently-broken binaries from the same tag.
          SUPABASE_URL: https://jmitbnrofacxwsbwuxzs.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}
          CURFEW_WEB_URL: https://curfew.vip
        with:
          projectPath: agent
          # Relative to `projectPath` (agent/), not the repo root — see the
          # identical note in release-macos.yml, where this same doubled-path
          # bug failed a real release run.
          args: --config src-tauri/tauri.windows-release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Curfew Agent ${{ github.ref_name }}'
